[package]
name = "logmast-cli"
version = "0.3.1"
edition.workspace = true
license = "Apache-2.0"
description = "Logmast management CLI; API-only collection"
publish = false
[[bin]]
name = "logmastctl"
path = "src/main.rs"
[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
rand = "0.10.3"
hex.workspace = true
sha2.workspace = true
hmac = "0.13.0"
ureq = { version = "3.5.0", features = ["json"] }
url = "2.5.8"
libc = "0.2.189"
[dev-dependencies]
axum.workspace = true
tokio.workspace = true
[lints]
workspace = true
